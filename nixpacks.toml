[phases.setup]
nixPkgs = ["nodejs_24"]
nixpkgsArchive = "c508844df6c28fa6dabc1b6af70f3ccbd65c5201"

[phases.install]
cmds = ["CI=1 npx --yes pnpm@11.20.0 install --frozen-lockfile --trust-lockfile --filter @outlayr/web..."]

[phases.build]
cmds = ["cd apps/web && ./node_modules/.bin/vp build"]

[start]
cmd = "node apps/web/.output/server/index.mjs"
