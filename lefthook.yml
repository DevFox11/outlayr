# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

# Kept off pre-commit deliberately: these run on the whole graph, not staged
# files, so they are too slow to sit between "git commit" and a prompt. Pushing
# is the right gate — it is the last point before anyone else sees the code.
# @outlayr/ios is excluded: its test target is an xcodebuild run that needs Xcode
# and a booted simulator, so it fails on destination selection here and is not a
# gate anyone can satisfy before a push. CI owns that one.
pre-push:
  parallel: true
  jobs:
    - name: types
      run: pnpm turbo run check-types --filter='!@outlayr/ios'
    - name: tests
      run: pnpm turbo run test --filter='!@outlayr/ios'
