# Baseline SwiftLint configuration for the Outlayr app.
#
# The build-tool plugin was added without a config, so SwiftLint was enforcing
# its full default ruleset (at default severities) against an existing codebase
# and failing the build. The rules below are relaxed to a realistic baseline for
# this project; tighten them incrementally rather than blocking every build.

disabled_rules:
  - identifier_name          # short math vars (r, g, b, x, y) and SwiftUI view-builder funcs (RowView, ToggleRow)
  - line_length              # long data literals and view modifiers
  - file_length              # large existing view/data files
  - type_body_length         # large existing views
  - function_body_length     # large existing functions
  - cyclomatic_complexity    # complex existing data logic
  - large_tuple              # multi-member tuples in widget/data code
  - force_cast               # pre-existing force casts
  - shorthand_operator       # pre-existing non-shorthand assignments

excluded:
  - .build
  - DerivedData
