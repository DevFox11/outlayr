appId: com.tryoutlayr.app
name: Create Transaction states the entry as one sentence
---
- runFlow: launch.yaml

- tapOn: "Log"
- tapOn: "Add"
- tapOn: "Create transaction"

- assertVisible: "Create Transaction"

# Create mode opens the amount sheet immediately. iOS correctly hides the
# covered form from the accessibility tree while that modal is up, so dismiss
# it before asserting the sentence's controls.
- extendedWaitUntil:
      visible: "Sheet Grabber"
      timeout: 15000
- swipe:
      start: 50%, 62%
      end: 50%, 95%
- extendedWaitUntil:
      notVisible: "Sheet Grabber"
      timeout: 15000

- assertVisible: "Expense"
- assertVisible: "Income"

# Every fact the sentence carries is a tap target, and each one names its field
# for VoiceOver. Asserting the labels rather than the blank copy keeps this flow
# working in either language.
- assertVisible: "Amount"
- assertVisible: "Name"
- assertVisible: "Category"
- assertVisible: "Account"
- assertVisible: "Date"

# Anything optional and unset lives here rather than costing a row.
- assertVisible: "+ tags"
- assertVisible: "+ split"
- assertVisible: "+ repeat"
- assertVisible: "+ note"

- assertVisible: "Add Transaction"

- takeScreenshot: artifacts/transaction-form

- swipe:
      start: 50%, 12%
      end: 50%, 90%
- assertVisible: "Log"
