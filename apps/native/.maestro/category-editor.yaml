appId: com.tryoutlayr.app
name: Category editor Form section survives extraction
---
- runFlow: launch.yaml

- openLink: outlayr://settings/categories/create

- extendedWaitUntil:
    visible: "New Category"
    timeout: 30000

# The rows live inside a Section returned by a function component. A Form child
# that @expo/ui refuses to lay out is proposed no height and collapses silently,
# taking its rows with it — so asserting the rows is what proves the seam holds.
- assertVisible: "Name"
- assertVisible: "Type"
- assertVisible: "Choose an icon & color"
- assertVisible: "Add Category"

- takeScreenshot: artifacts/category-editor
