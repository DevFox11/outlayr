steps:
    - echo: Deep in the Log; add a 12.50 entry at Lidl dated yesterday
    - tap: { text: Add }
    - await: { visible: { text: Add a transaction }, timeout: 5000 }
    - tap: { text: Add a transaction }
    - await: { visible: { id: stage-footer }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: "1" }
    - tap: { text: "2" }
    - tap: { text: . }
    - tap: { text: "5" }
    - tap: { text: "0" }
    - await: { visible: { text: "Amount, $12.50" }, timeout: 5000 }
    - tap: { text: Next }
    - await: { visible: { id: stage-merchant-field }, timeout: 5000 }
    - tap: { text: Lidl }
    - await: { visible: { text: "Name, Lidl" }, timeout: 5000 }
    - tap: { text: "Date, today" }
    - await: { visible: { text: yesterday }, timeout: 5000 }
    - tap: { text: yesterday }
    - await: { visible: { text: "Date, yesterday" }, timeout: 5000 }
    - tap: { text: Save }
    - await: { hidden: { id: stage-footer }, timeout: 30000 }
    - await: { idle: true }
executionPrerequisite: perf-log-deep-write-setup has just run, so the Log is about a year deep. The entry is dated yesterday, a day that must already have entries; a write that opens a new day re-reads the whole window on every build. The seed's last day is the day it ran, so this holds the day after seeding; on a later day, re-seed or pick a seeded day.
