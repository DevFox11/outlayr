executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top. 90 momentum flings at 0.7 s apart page the window about 380 days deep. measure.ts runs it before the profiler starts, so the flings stay out of the profile of perf-log-deep-write.
