steps:
    - echo: On the Log with the seeded ledger; New entry, open the currency step, then type "euro" one key per step
    - await: { visible: { text: Hide amounts }, timeout: 20000 }
    - await: { idle: true }
    - tap: { text: Add }
    - await: { visible: { text: Add a transaction }, timeout: 5000 }
    - tap: { text: Add a transaction }
    - await: { visible: { id: stage-footer }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: "Change the amount's currency" }
    - await: { visible: { text: Search currencies }, timeout: 5000 }
    - await: { idle: true }
    - tap: { text: Search currencies }
    - await: { idle: true }
    - tool: keyboard
      args: { text: e }
    - tool: keyboard
      args: { text: u }
    - tool: keyboard
      args: { text: r }
    - tool: keyboard
      args: { text: o }
    - await: { visible: { text: Euro }, timeout: 5000 }
    - await: { idle: true }
executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top.
