steps:
    - echo: On the Log with the seeded ledger; hide and show amounts three times, one settings write per tap
    - await: { visible: { text: Hide amounts }, timeout: 20000 }
    - await: { idle: true }
    - tap: { text: Hide amounts }
    - await: { visible: { text: Show amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Show amounts }
    - await: { visible: { text: Hide amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Hide amounts }
    - await: { visible: { text: Show amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Show amounts }
    - await: { visible: { text: Hide amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Hide amounts }
    - await: { visible: { text: Show amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Show amounts }
    - await: { visible: { text: Hide amounts }, timeout: 10000 }
    - await: { idle: true }
executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top with amounts shown.
