steps:
    - echo: On the Log with the seeded ledger; open Search and type a merchant one key per step, one ledger read per keystroke before the debounce
    - await: { visible: { text: Hide amounts }, timeout: 20000 }
    - await: { idle: true }
    - tap: { text: Search }
    - await: { visible: { text: Search your ledger }, timeout: 10000 }
    - await: { idle: true }
    - tool: keyboard
      args: { text: c }
    - tool: keyboard
      args: { text: a }
    - tool: keyboard
      args: { text: r }
    - tool: keyboard
      args: { text: r }
    - tool: keyboard
      args: { text: e }
    - tool: keyboard
      args: { text: f }
    - tool: keyboard
      args: { text: o }
    - tool: keyboard
      args: { text: u }
    - tool: keyboard
      args: { text: r }
    - await: { visible: { text: results }, timeout: 10000 }
    - await: { idle: true }
executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top.
