name: Ship to TestFlight

# Manual only, on purpose. This deploys a Convex deployment before it builds, and
# a bad schema change is not as cheap to undo as a bad binary.
# Add an `on.push` trigger once you are happy running it on every merge.
on:
    workflow_dispatch:
        inputs:
            profile:
                type: choice
                description: Build profile to ship. Also selects the EAS environment.
                options:
                    - production
                    - preview
                default: production
                required: true

# Pinned, not `auto`. `auto` reads the image off the app's SDK version, which it
# can only do when the run resolves its base directory to apps/native. A run that
# resolves it to the repository root gets no SDK and falls back to the legacy
# Ubuntu 22.04 image (Node 18, pnpm 8.7.5), where `pnpm install --frozen-lockfile`
# fails with ERR_PNPM_NO_LOCKFILE: pnpm 8 cannot read a lockfileVersion 9 lockfile.
#
# `sdk-XX` resolves per runner, so this one tag covers both the Linux deploy job
# and the macOS build. Bump it in every workflow here with every Expo SDK upgrade.
defaults:
    image: sdk-58

jobs:
    # Deploy the backend first so the binary is never newer than the API it calls.
    #
    # The deploy target is configuration, not code. `npx convex deploy` picks its
    # target from the environment, so which deployment this pushes to is decided by
    # the EAS environment variables, not by this file:
    #
    #   Convex Cloud   CONVEX_DEPLOY_KEY
    #   Self-hosted    CONVEX_SELF_HOSTED_URL + CONVEX_SELF_HOSTED_ADMIN_KEY
    #
    # The build profile names match the EAS environment names exactly, so one input
    # selects both, and the functions always land on the deployment the binary in
    # the same run is built to call.
    deploy_backend:
        name: Deploy Convex functions
        environment: ${{ inputs.profile }}
        defaults:
            run:
                # Absolute, so it resolves from the repository root. A relative path
                # resolves from the app's base directory (apps/native), which put the
                # step in apps/native/packages/backend and failed with ENOENT.
                working_directory: /packages/backend
        steps:
            - uses: eas/checkout
            - uses: eas/install_node_modules
            - name: Resolve the Convex deploy target
              # Fail here rather than let `convex deploy` pick up an unset variable and
              # push to whichever deployment happens to be configured by default.
              run: |
                  if [ -n "$CONVEX_DEPLOY_KEY" ]; then
                    echo "Convex target: cloud (CONVEX_DEPLOY_KEY)"
                  elif [ -n "$CONVEX_SELF_HOSTED_URL" ] && [ -n "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]; then
                    echo "Convex target: self-hosted at $CONVEX_SELF_HOSTED_URL"
                  else
                    echo "No Convex deploy credentials on the selected EAS environment." >&2
                    echo "Set CONVEX_DEPLOY_KEY, or both CONVEX_SELF_HOSTED_URL and CONVEX_SELF_HOSTED_ADMIN_KEY." >&2
                    exit 1
                  fi
            - name: Deploy functions
              run: npx convex deploy -y

    build_ios:
        name: Build iOS
        needs: [deploy_backend]
        type: build
        params:
            platform: ios
            profile: ${{ inputs.profile }}

    submit_ios:
        name: Submit to TestFlight
        needs: [build_ios]
        type: submit
        params:
            build_id: ${{ needs.build_ios.outputs.build_id }}
            # A submit profile carries only App Store Connect credentials, so the
            # same one serves every build profile.
            profile: production
            groups: ["Internal"]
