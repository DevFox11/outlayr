name: Publish an update

# Manual, like the TestFlight workflow. An update reaches every device on the
# channel at its next launch, so it is a release, not a build artifact.
on:
    workflow_dispatch:
        inputs:
            channel:
                type: choice
                description: Channel to publish to. Also selects the EAS environment.
                options:
                    - production
                    - preview
                default: preview
                required: true
            message:
                type: string
                description: Release notes for the What's new sheet, one per line (-F message=$'First\nSecond').
                required: true
            # One platform per run: the runtime fingerprint is per platform, so iOS
            # and Android can each need an OTA or a build on their own.
            platform:
                type: choice
                description: Platform to publish for.
                options:
                    - ios
                    - android
                default: ios

defaults:
    image: sdk-58

jobs:
    # Same stage as .github/workflows/eas-build.yml, for the same reason: an update can add or
    # reshape a Convex function, and `src/lib/convex.ts` calls them by name, so
    # JS must never reach a device before the deployment it talks to.
    deploy_backend:
        name: Deploy Convex functions
        environment: ${{ inputs.channel }}
        defaults:
            run:
                working_directory: /packages/backend
        steps:
            - uses: eas/checkout
            - uses: eas/install_node_modules
            - name: Resolve the Convex deploy target
              run: |
                  if [ -n "$CONVEX_DEPLOY_KEY" ]; then
                    echo "Convex target: cloud (CONVEX_DEPLOY_KEY)"
                  elif [ -n "$CONVEX_SELF_HOSTED_URL" ] && [ -n "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]; then
                    echo "Convex target: self-hosted at $CONVEX_SELF_HOSTED_URL"
                  else
                    echo "No Convex deploy credentials on the selected EAS environment." >&2
                    echo "Set CONVEX_DEPLOY_KEY, or both CONVEX_SELF_HOSTED_URL and CONVEX_SELF_HOSTED_ADMIN_KEY." >&2
                    exit 1
                  fi
            - name: Deploy functions
              run: npx convex deploy -y

    publish:
        name: Publish JS to ${{ inputs.channel }}
        needs: [deploy_backend]
        environment: ${{ inputs.channel }}
        # Job level: a step's `env:` values are not interpolated. Run 01a082be
        # published to a channel literally named `${{ inputs.channel }}`.
        env:
            # Feeds app.config.ts's icon pick, which is part of the fingerprint.
            # EAS Build sets it; a custom job does not.
            EAS_BUILD_PROFILE: ${{ inputs.channel }}
            # Not inlined into the script, so backticks in a message stay text.
            UPDATE_MESSAGE: ${{ inputs.message }}
            UPDATE_PLATFORM: ${{ inputs.platform || 'ios' }}
        steps:
            - uses: eas/checkout
            - uses: eas/install_node_modules
            # `intlayer build` writes the gitignored `.intlayer/` the bundle imports.
            # The build workflow runs it in its own step; this job has to as well.
            - name: Build the i18n dictionaries
              run: pnpm exec intlayer build
            - name: Publish
              run: |
                  case "$EAS_BUILD_PROFILE" in
                    production|preview) ;;
                    *) echo "EAS_BUILD_PROFILE did not interpolate: '$EAS_BUILD_PROFILE'" >&2; exit 1 ;;
                  esac
                  case "$UPDATE_PLATFORM" in
                    ios|android) ;;
                    *) echo "UPDATE_PLATFORM did not interpolate: '$UPDATE_PLATFORM'" >&2; exit 1 ;;
                  esac
                  npx eas-cli update --channel "$EAS_BUILD_PROFILE" --message "$UPDATE_MESSAGE" --platform "$UPDATE_PLATFORM" --non-interactive
            # An update ships new Hermes chunks, so its source maps are uploaded here;
            # builds upload theirs from the Xcode phase and Gradle script that
            # posthog-react-native/expo adds.
            - name: Upload source maps to PostHog
              run: |
                  APP_VERSION=$(npx expo config --type public --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  pnpm exec posthog-cli hermes upload --directory dist --release-name com.tryoutlayr.app --release-version "$APP_VERSION"
