name: Ship to Google Play

# The Android twin of testflight.yml, manual for the same reason: it deploys a
# Convex deployment before it builds.
#
# Each missing piece of the Play setup stops the run with its own error, in this
# order. Only the first is checked before the backend deploys: EAS has no
# non-interactive way to ask whether Android credentials exist, so a run without
# them still deploys main's functions first.
#
#   EXPO_PUBLIC_REVENUECAT_ANDROID_KEY   checked below, before the deploy
#   Upload keystore                      the build fails: EAS cannot create one non-interactively.
#                                        `eas credentials:configure-build -p android -e <profile>`
#   Play app + service account key       the submit fails: `eas credentials -p android`
#
# The track and release status come from `submit.production.android` in eas.json.
# It has to say `releaseStatus: draft` until the app is published, because Play
# refuses any other release on a draft app.
on:
    workflow_dispatch:
        inputs:
            profile:
                type: choice
                description: Build profile to ship. Also selects the EAS environment.
                options:
                    - production
                    - preview
                default: production
                required: true

# Pinned for the reason testflight.yml gives.
defaults:
    image: sdk-58

jobs:
    # Backend first, for the reasons testflight.yml gives.
    deploy_backend:
        name: Deploy Convex functions
        environment: ${{ inputs.profile }}
        defaults:
            run:
                working_directory: /packages/backend
        steps:
            - uses: eas/checkout
            # The app reads this key at runtime, so a binary built without it
            # builds fine and ships a paywall with no plans.
            - name: Check the Android release setup
              run: |
                  if [ -z "$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY" ]; then
                    echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY is not set on the selected EAS environment." >&2
                    echo "Connect the Play app to RevenueCat and add its goog_ key before shipping Android." >&2
                    exit 1
                  fi
            - uses: eas/install_node_modules
            - name: Resolve the Convex deploy target
              run: |
                  if [ -n "$CONVEX_DEPLOY_KEY" ]; then
                    echo "Convex target: cloud (CONVEX_DEPLOY_KEY)"
                  elif [ -n "$CONVEX_SELF_HOSTED_URL" ] && [ -n "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]; then
                    echo "Convex target: self-hosted at $CONVEX_SELF_HOSTED_URL"
                  else
                    echo "No Convex deploy credentials on the selected EAS environment." >&2
                    echo "Set CONVEX_DEPLOY_KEY, or both CONVEX_SELF_HOSTED_URL and CONVEX_SELF_HOSTED_ADMIN_KEY." >&2
                    exit 1
                  fi
            - name: Deploy functions
              run: npx convex deploy -y

    build_android:
        name: Build Android
        needs: [deploy_backend]
        type: build
        params:
            platform: android
            profile: ${{ inputs.profile }}

    submit_android:
        name: Submit to Google Play
        needs: [build_android]
        type: submit
        params:
            build_id: ${{ needs.build_android.outputs.build_id }}
            # Lands on the internal track as a draft. Roll it out in Play Console.
            profile: production
