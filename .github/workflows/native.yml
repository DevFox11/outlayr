name: Native

on:
  push:
    branches: [main]
    paths:
      - "apps/native/**"
      - "packages/**"
      - ".github/workflows/native.yml"
      - "biome.json"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/native/**"
      - "packages/**"
      - ".github/workflows/native.yml"
      - "biome.json"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The @hugeicons-pro packages come from a private registry whose
      # credential cannot live in the committed .npmrc — pnpm refuses to expand
      # env vars in project-level auth settings. Write it to the user-level
      # config instead, where pnpm still resolves it.
      - name: Authenticate the private icon registry
        env:
          HUGEICONS_PRO_TOKEN: ${{ secrets.HUGEICONS_PRO_TOKEN }}
        run: |
          if [ -z "$HUGEICONS_PRO_TOKEN" ]; then
            echo "::error::HUGEICONS_PRO_TOKEN is not set. @hugeicons-pro/* will 401."
            exit 1
          fi
          pnpm config set "//npm.hugeicons.com/:_authToken" "$HUGEICONS_PRO_TOKEN" --location user

      - run: pnpm install --frozen-lockfile

      # uniwind derives ThemeName from a declaration it generates off global.css.
      # That file is build output and gitignored, so on a clean clone ThemeName
      # widens to `string` and the theme context stops typechecking. Metro
      # regenerates it on dev and export; nothing else does.
      - name: Generate uniwind artifacts
        working-directory: apps/native
        run: npx uniwind generate-artifacts --css ./global.css --dts ./uniwind-types.d.ts

      - name: Lint
        run: pnpm turbo run lint --filter=@outlayr/native

      - name: Typecheck
        run: pnpm turbo run check-types --filter=@outlayr/native

      # `intlayer build` compiles a half-translated key without complaining and
      # the app then falls back to English at runtime. This is the only step
      # that fails on one.
      - name: i18n coverage
        run: pnpm turbo run i18n:test --filter=@outlayr/native

      - name: Tests
        run: pnpm turbo run test --filter=@outlayr/native

  bundle:
    name: expo export (ios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Authenticate the private icon registry
        env:
          HUGEICONS_PRO_TOKEN: ${{ secrets.HUGEICONS_PRO_TOKEN }}
        run: |
          if [ -z "$HUGEICONS_PRO_TOKEN" ]; then
            echo "::error::HUGEICONS_PRO_TOKEN is not set. @hugeicons-pro/* will 401."
            exit 1
          fi
          pnpm config set "//npm.hugeicons.com/:_authToken" "$HUGEICONS_PRO_TOKEN" --location user

      - run: pnpm install --frozen-lockfile

      # `.intlayer/` is generated and gitignored. The `check-types` and `test`
      # scripts each run `intlayer build` themselves, so the other job never
      # noticed; `expo export` does not, and Metro fails resolving
      # `.intlayer/config/configuration.mjs` before it reaches a line of app code.
      # That has been failing this job on every branch, main included, which left
      # the only check that can catch a bundling regression permanently red.
      - name: Build the i18n catalog
        working-directory: apps/native
        run: pnpm i18n:build

      # A green lint/typecheck still lets a module-resolution or Metro config
      # regression through. Bundling is the cheapest check that the app can
      # actually be built, and it catches the Skia directory-index resolution
      # that watchFolders changes can break.
      - name: Bundle
        working-directory: apps/native
        run: npx expo export --platform ios --output-dir /tmp/export-ci

      # The SF Pro Rounded OTFs are licensed and gitignored, so app.config.ts
      # filters them out on a clean clone and the plugin embeds nothing. That
      # renders the whole app in the system fallback face with no error, which
      # would silently invalidate any screenshot baseline.
      - name: Assert the font layer is not silently empty
        working-directory: apps/native
        run: |
          if npx expo config --type public --json | grep -q '"SF-Pro-Rounded-Regular.otf"'; then
            echo "SF Pro Rounded is embedded."
          else
            echo "::warning::SF Pro Rounded OTFs are absent — this build renders in the system fallback face."
          fi
