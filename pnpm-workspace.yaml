packages:
    - apps/*
    - packages/*
allowBuilds:
    "@parcel/watcher": false
    "@posthog/cli": true
    "@shopify/react-native-skia": true
    better-sqlite3: true
    core-js: false
    esbuild: true
    sharp: false
catalog:
    "@better-auth/expo": ~1.6.15
    "@convex-dev/agent": ^0.7.1
    "@convex-dev/better-auth": ^0.12.5
    better-auth: ~1.6.15
    convex: ^1.45.0
    dotenv: ^17.4.2
    intlayer: ^9.5.2
    react-intlayer: ^9.5.2
    react-native-intlayer: ^9.5.2
    vite-intlayer: ^9.5.2
    zod: ^4.6.2
    typescript: ~6.0.3
packageExtensions:
    "@tanstack/react-router":
        peerDependencies:
            "@types/react": "*"
        peerDependenciesMeta:
            "@types/react":
                optional: true
    "@tanstack/react-start-client":
        peerDependencies:
            "@types/react": "*"
        peerDependenciesMeta:
            "@types/react":
                optional: true
minimumReleaseAgeExclude:
    - ultracite@7.10.4
    - panelui-native@0.75.1
    - "@ai-sdk/gateway@4.0.87"
    - "@ai-sdk/provider-utils@5.0.45"
    - "@ai-sdk/xai@5.0.4"
    - ai@7.0.107

patchedDependencies:
    expo-widgets@58.0.11: patches/expo-widgets@58.0.11.patch
    number-flow-react-native@0.5.1: patches/number-flow-react-native@0.5.1.patch
    panelui-native@0.105.0: patches/panelui-native@0.105.0.patch
