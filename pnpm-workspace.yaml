packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  lefthook: true
  better-sqlite3: true
  '@shopify/react-native-skia': true
  # intlayer pulls this in for `intlayer watch`; the build pipeline only ever
  # runs `intlayer build`, so CI needs no native toolchain for it.
  '@parcel/watcher': false
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ~6.0.3
  better-auth: 1.6.15
  "@better-auth/expo": 1.6.15
  "@convex-dev/better-auth": ^0.12.5
  dinero.js: 2.0.2
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  babel-plugin-inline-import: 3.0.0
  better-sqlite3: 12.11.1
  "@types/better-sqlite3": 7.6.13
  expo-sqlite: 57.0.0
  expo-crypto: 57.0.0
  tailwind-merge: ^3.6.0
minimumReleaseAgeExclude:
  - convex@1.42.2
  - '@biomejs/biome@2.5.4'
  - '@biomejs/cli-darwin-arm64@2.5.4'
  - '@biomejs/cli-darwin-x64@2.5.4'
  - '@biomejs/cli-linux-arm64-musl@2.5.4'
  - '@biomejs/cli-linux-arm64@2.5.4'
  - '@biomejs/cli-linux-x64-musl@2.5.4'
  - '@biomejs/cli-linux-x64@2.5.4'
  - '@biomejs/cli-win32-arm64@2.5.4'
  - '@biomejs/cli-win32-x64@2.5.4'
  - '@expo/cli@57.0.10'
  - '@expo/config-plugins@57.0.6'
  - '@expo/config@57.0.6'
  - '@expo/fingerprint@0.20.6'
  - '@expo/image-utils@0.11.4'
  - '@expo/metro-config@57.0.7'
  - '@expo/metro-runtime@57.0.7'
  - '@expo/prebuild-config@57.0.9'
  - '@expo/require-utils@57.0.4'
  - '@expo/router-server@57.0.4'
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-linking@57.0.4
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo-router@57.0.8
  - expo-splash-screen@57.0.5
  - expo-web-browser@57.0.2
  - expo@57.0.8
